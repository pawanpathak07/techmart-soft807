<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechMart - Log in</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to check out and see your orders.</p>
      <div id="alert" class="alert"></div>
      <form id="form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" style="width:100%" type="submit">Log in</button>
      </form>
      <p class="small" style="text-align:center;margin-bottom:0">New here? <a href="/register.html">Create an account</a></p>
      <div class="hint">
        <strong>Demo accounts</strong><br>
        Admin: admin@shop.local / Admin@123<br>
        Customer: demo@shop.local / Customer@123
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
