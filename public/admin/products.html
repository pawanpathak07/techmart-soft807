<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Products</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div><h1>Products</h1><p class="muted" style="margin:0">Add, edit and remove what the shop sells.</p></div>
      <button class="btn primary" id="addBtn">+ Add product</button>
    </div>
    <div class="toolbar"><input id="search" type="search" placeholder="Search by name or category..."></div>
    <div class="card table-wrap" id="table"></div>
  </main>

  <dialog id="dlg">
    <form id="form" novalidate>
      <h2 id="dlgTitle">Add product</h2>
      <div id="formAlert" class="alert"></div>
      <div class="field"><label for="name">Name</label><input id="name" required maxlength="120"></div>
      <div class="row">
        <div class="field"><label for="category">Category</label><input id="category" maxlength="60" placeholder="General"></div>
        <div class="field"><label for="price">Price ($)</label><input id="price" type="number" min="0" step="0.01" required></div>
      </div>
      <div class="row">
        <div class="field"><label for="stock">Stock</label><input id="stock" type="number" min="0" step="1" required></div>
        <div class="field"><label for="image_url">Image URL (optional)</label><input id="image_url" type="text" placeholder="https://... or /images/products/mouse.png"></div>
      </div>
      <div class="field"><label for="description">Description</label><textarea id="description" maxlength="2000"></textarea></div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/common.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
